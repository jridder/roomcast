<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="0.5" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="0.55" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
  <!-- shadow / base -->
  <rect x="30" y="42" width="56" height="78" rx="12" fill="#241f31" opacity="0.35"/>
  <!-- cabinet -->
  <rect x="28" y="38" width="56" height="78" rx="12" fill="url(#body)"/>
  <rect x="32" y="42" width="48" height="70" rx="9" fill="url(#face)"/>
  <!-- tweeter -->
  <circle cx="56" cy="58" r="8" fill="#241f31"/>
  <circle cx="56" cy="58" r="6" fill="url(#cone)"/>
  <circle cx="56" cy="57" r="1.8" fill="#c0bfbc"/>
  <!-- woofer -->
  <circle cx="56" cy="88" r="17" fill="#241f31"/>
  <circle cx="56" cy="88" r="14.5" fill="url(#cone)"/>
  <circle cx="56" cy="88" r="5" fill="#241f31"/>
  <circle cx="55" cy="86.5" r="2" fill="#9a9996"/>
  <!-- wireless waves -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M86 36 a14 14 0 0 1 14 14" stroke-width="6"/>
    <path d="M86 22 a28 28 0 0 1 28 28" stroke-width="6"/>
    <path d="M86 10 a38 38 0 0 1 38 38" stroke-width="6" opacity="0.75"/>
  </g>
  <circle cx="88" cy="48" r="4.5" fill="#3584e4"/>
</svg>
